[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sector-pairs-research"
version = "0.1.0"
description = "Causal structural-instability research for sector ETF pairs"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2", "statsmodels>=0.14,<0.16", "matplotlib>=3.8,<4", "yfinance>=0.2.54,<2", "tabulate>=0.9,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
pairs-research = "sector_pairs.cli:main"

[tool.setuptools.packages.find]
include = ["sector_pairs*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
